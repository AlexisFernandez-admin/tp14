<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contacto - Proyecto Base</title>
  <link rel="stylesheet" href="style.css"> <!-- llama al style.css -->
</head>
<body>

  <div class="tarjeta-principal">
    <h1>Página de Contacto</h1>
    <p>Completa el siguiente formulario para enviarme un mensaje directo.</p>

   
    <form class="formulario-contacto" action="#" method="post">
      
      <label for="nombre">Nombre completo:</label>
      <input type="text" id="nombre" name="nombre" placeholder="Tu nombre" required>

      <label for="email">Correo electrónico:</label>
      <input type="email" id="email" name="email" placeholder="nose@gmail.com" required>

      <label for="mensaje">Mensaje:</label>
      <textarea id="mensaje" name="mensaje" rows="5" placeholder="Escribe tu mensaje" required></textarea>

      <button type="submit">Enviar Mensaje</button>
    </form>

    <div style="margin-top: 25px; text-align: center;">
      <a href="index.html">← Volver a index.html</a> <!--vuelve al menu principal-->
    </div>
  </div>

</body>
</html>
